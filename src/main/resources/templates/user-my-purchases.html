<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>My Purchases</title>
<style>
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f7, #d9e4f5);
    padding: 40px;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

th {
    background: #4a90e2;
    color: white;
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 0.5px;
    padding: 14px;
}

td {
    padding: 14px;
    font-size: 14px;
    color: #555;
}

tr {
    transition: all 0.2s ease;
}

tr:nth-child(even) {
    background-color: #f8f9fc;
}

tr:hover {
    background-color: #eef4ff;
    transform: scale(1.005);
}

img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #eee;
}

/* Status Badge Styles */
.status {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    color: white;
}

.status-success {
    background-color: #28a745;
}

.status-pending {
    background-color: #ffc107;
    color: #333;
}

.status-cancelled {
    background-color: #dc3545;
}

/* Back Button */
a {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 18px;
    background: #4a90e2;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.3s;
}

a:hover {
    background: #357abd;
}
</style>
</head>
<body>

<h2>My Purchases</h2>
<div th:if="${param.reviewed}" 
     style="color:red;text-align:center;margin-bottom:15px;">
    You already reviewed this product.
</div>
<table border="1">
<tr>
<th>ID</th>
<th>Product</th>
<th>Product id</th>
<th>Image</th>
<th>Quantity</th>
<th>Total Amount</th>
<th>Payment</th>
<th>Status</th>
<th>Date</th>
<th>Review</th>
</tr>

<tr th:each="p : ${purchases}">

    <!-- Purchase ID -->
    <td th:text="${p.id}"></td>

    <!-- Product Name -->
   <td th:text="${productMap[p.productId] != null ? productMap[p.productId].productName : 'Deleted Product'}"></td>
<td th:text="${p.productId}"></td>
    <!-- Product Image -->
    <td>
        <img th:if="${productMap[p.productId] != null 
and productMap[p.productId].images != null 
and !productMap[p.productId].images.isEmpty()}"
th:src="'data:image/jpeg;base64,' + ${productMap[p.productId].images[0].base64Image}" />

<span th:if="${productMap[p.productId] == null}">
Deleted
</span>
    </td>

    <td th:text="${p.quantity}"></td>
    <td th:text="${p.totalAmount}"></td>
    <td th:text="${p.paymentMethod}"></td>
   <td>
    <span class="status"
          th:classappend="${p.status == 'SUCCESS'} ? ' status-success' :
                          (${p.status == 'PENDING'} ? ' status-pending' :
                          ' status-cancelled')"
          th:text="${p.status}">
    </span>
</td>
    <td th:text="${p.purchaseDate}"></td>
   <td>
    <a th:if="${p.status == 'SUCCESS'}"
       th:href="@{'/user/review/' + ${p.productId}}"
       style="background:#4a90e2;color:white;padding:6px 12px;border-radius:6px;text-decoration:none;">
        Write Review
    </a>
</td>

</tr>

</table>

<br>
<a href="/user/dashboard">⬅ Back</a>

</body>
</html>
