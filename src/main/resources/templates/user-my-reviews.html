<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>My Reviews</title>

<style>
body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th{
background:#007bff;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
border:1px solid #ddd;
}

img{
width:60px;
height:60px;
object-fit:cover;
border-radius:6px;
}

.status{
padding:5px 10px;
border-radius:20px;
font-size:12px;
color:white;
}

.pending{
background:orange;
}

.approved{
background:green;
}
</style>
</head>

<body>

<h2>My Product Reviews</h2>

<table>

<tr>
<th>ID</th>
<th>Product</th>
<th>Image</th>
<th>Rating</th>
<th>Comment</th>
<th>Status</th>
<th>Date</th>
<th>View Product</th>

</tr>

<tr th:each="r : ${reviews}">

<td th:text="${r.id}"></td>

<td th:text="${productMap[r.productId] != null ? productMap[r.productId].productName : 'Deleted Product'}"></td>

<td>
<img th:if="${productMap[r.productId] != null 
and productMap[r.productId].images != null 
and !productMap[r.productId].images.isEmpty()}"
th:src="'data:image/jpeg;base64,' + ${productMap[r.productId].images[0].base64Image}">
</td>

<td th:text="${r.rating} + ' ⭐'"></td>

<td th:text="${r.comment}"></td>

<td>
<span class="status"
th:classappend="${r.status == 'APPROVED'} ? ' approved' : ' pending'"
th:text="${r.status}">
</span>
</td>

<td th:text="${r.reviewDate}"></td>
<td>
<a th:href="@{/user/products/view/{id}(id=${r.productId})}"
   style="padding:6px 12px;background:#28a745;color:white;text-decoration:none;border-radius:4px;">
   View Product
</a>
</td>

</tr>

</table>

<br>
<a href="/user/dashboard">⬅ Back</a>

</body>
</html>
