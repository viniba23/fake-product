<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verification Result</title>

    <style>
        body { text-align:center; padding:50px; font-family:Arial; }
        .btn {
            padding:10px 20px;
            background:#007bff;
            color:white;
            text-decoration:none;
            border:none;
            cursor:pointer;
        }
    </style>
</head>
<body>

<h2>Verification Result</h2>

<div th:if="${success}">
    <h3 style="color:green;" th:text="${success}"></h3>

    <div th:if="${product != null}">
        <p><strong>Product:</strong>
            <span th:text="${product.productName}"></span></p>

        <br>

        <!-- Purchase Button -->
        <a th:href="@{/user/products/purchase/{id}(id=${product.id})}"
           class="btn">
            Purchase Product
        </a>
        
        
    </div>
</div>

<div th:if="${error}">
    <h3 style="color:red;" th:text="${error}"></h3>
</div>

<br><br>
<a href="/user/dashboard">Go to Dashboard</a>

</body>
</html>
